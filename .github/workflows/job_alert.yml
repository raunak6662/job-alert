name: Job Alert Checker

on:
  # Every 2 hours at :30 past. 02:30 UTC = 08:00 IST -> the daily heartbeat run.
  schedule:
    - cron: '30 */2 * * *'
  workflow_dispatch:          # lets you trigger a run manually from the Actions tab

permissions:
  contents: write             # needed to commit seen.json back to the repo

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Run job checker
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python checker.py

      - name: Commit state (seen.json + heartbeat.json)
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add seen.json heartbeat.json
          # nothing to commit? exit cleanly
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "update state [skip ci]"
          # Retry loop: rebase onto any new remote commits, then push.
          # Handles overlapping runs / manual pushes without failing the job.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && break
            echo "push attempt $i failed, retrying..."
            sleep 3
          done